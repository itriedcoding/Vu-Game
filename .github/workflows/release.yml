name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release (for example v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1
            $tag = "v" + $match.Matches.Groups[1].Value
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Build optimized executable
        run: cargo build --workspace --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $version = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/volt.exe dist/Volt.exe
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/* -DestinationPath "Volt-$version-windows-x64.zip" -Force
          $hash = (Get-FileHash "Volt-$version-windows-x64.zip" -Algorithm SHA256).Hash
          "$hash  Volt-$version-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Item target/release/volt.exe, "Volt-$version-windows-x64.zip" | Select-Object Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Volt ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/volt.exe
            Volt-*-windows-x64.zip
            SHA256SUMS.txt
          body: |
            Volt ${{ steps.release_tag.outputs.tag }} — a lightweight Roblox performance app for Windows 10 and 11.

            **Downloads**
            - `volt.exe` — portable 64-bit executable, no installer, no background service.
            - `Volt-*-windows-x64.zip` — the same executable with the README and license.
            - `SHA256SUMS.txt` — checksums for the archive.

            **Before you run it**
            - Windows SmartScreen may warn about an unsigned binary. Choose *More info → Run anyway* if you trust the source, or build from source with `cargo build --release`.
            - Volt needs no administrator rights for process priority or per-user Game Bar settings. The High performance power plan may need elevation on some systems; Volt reports that instead of hiding it.

            Volt never modifies Roblox files, never injects into the client and never touches anti-cheat, Defender or Windows services. Every change it makes can be undone from **Restore defaults**.

            Not affiliated with Roblox Corporation.
